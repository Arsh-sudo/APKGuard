version: "3.9"

services:

  # ── APKGuard Backend API ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apkguard-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads      # APK uploads persist on host
      - ./output:/app/output        # Analysis reports persist on host
      - ./models:/app/models        # Trained ML model
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - apkguard-net

  # ── Ollama LLM (local Llama 3.2) ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: apkguard-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama   # Models persist between restarts
    restart: unless-stopped
    networks:
      - apkguard-net

  # ── React Frontend (production build) ───────────────────────
  frontend:
    image: node:20-alpine
    container_name: apkguard-frontend
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    environment:
      - CHOKIDAR_USEPOLLING=true    # Hot reload in Docker on Windows
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - apkguard-net

volumes:
  ollama-data:

networks:
  apkguard-net:
    driver: bridge
